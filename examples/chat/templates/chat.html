<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gebweb chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    .chat-wrap { max-width: 720px; margin: 1.5rem auto; }
    #log { height: 60vh; overflow-y: auto; background: #f8f9fa; }
    .msg-system { color: #6c757d; font-style: italic; }
    .msg-self { color: #0d6efd; }
    .msg-other { color: #212529; }
    .from { font-weight: 600; }
  </style>
</head>
<body>
<div class="chat-wrap">
  <h1 class="h4 mb-3">Gebweb chat</h1>

  <div id="join-card" class="card mb-3">
    <div class="card-body">
      <label for="nickname" class="form-label">Pick a nickname</label>
      <div class="input-group">
        <input id="nickname" type="text" class="form-control" placeholder="e.g. ada" maxlength="32">
        <button id="join-btn" class="btn btn-primary">Join</button>
      </div>
    </div>
  </div>

  <div id="chat-card" class="card d-none">
    <div class="card-body p-3">
      <div id="log" class="border rounded p-2 mb-2"></div>
      <form id="send-form" class="input-group">
        <input id="msg" type="text" class="form-control" placeholder="Type a message..." autocomplete="off">
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
      <div id="status" class="small text-muted mt-2">disconnected</div>
    </div>
  </div>
</div>

<script>
  const log = document.getElementById('log');
  const status = document.getElementById('status');
  const sendForm = document.getElementById('send-form');
  const msgInput = document.getElementById('msg');
  const joinBtn = document.getElementById('join-btn');
  const nickInput = document.getElementById('nickname');
  const joinCard = document.getElementById('join-card');
  const chatCard = document.getElementById('chat-card');

  let ws = null;
  let nickname = '';

  function append(kind, from, body) {
    const row = document.createElement('div');
    row.classList.add('mb-1');
    if (kind === 'system') {
      row.classList.add('msg-system');
      row.textContent = body;
    } else {
      row.classList.add(from === nickname ? 'msg-self' : 'msg-other');
      const f = document.createElement('span');
      f.classList.add('from');
      f.textContent = from + ': ';
      row.appendChild(f);
      row.appendChild(document.createTextNode(body));
    }
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws');
    ws.onopen = () => {
      status.textContent = 'connected as ' + nickname;
      ws.send(JSON.stringify({type: 'hello', nickname: nickname}));
    };
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      append(m.type, m.from, m.body);
    };
    ws.onclose = () => { status.textContent = 'disconnected'; };
    ws.onerror = () => { status.textContent = 'error'; };
  }

  joinBtn.addEventListener('click', () => {
    nickname = nickInput.value.trim();
    if (!nickname) { return; }
    joinCard.classList.add('d-none');
    chatCard.classList.remove('d-none');
    connect();
    msgInput.focus();
  });

  sendForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = msgInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) { return; }
    ws.send(JSON.stringify({type: 'msg', body: text}));
    msgInput.value = '';
  });
</script>
</body>
</html>
