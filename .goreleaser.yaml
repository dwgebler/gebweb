# Release config for the Gebweb CLI (the `gebweb` command).
# This releases the CLI binary only. The Gebweb framework itself is Geblang
# source that a project installs as a dependency via `geblang install` from this
# repo (github.com/dwgebler/gebweb); the binary drives `gebweb new/dev/build`.
# The release body is the version's section from CHANGELOG.md (not the commit
# log): pass it with --release-notes.
# Validate locally:  goreleaser release --snapshot --clean --skip=publish
# Publish a release:
#   scripts/release-notes.sh 1.7.2 > /tmp/notes.md
#   git tag v1.7.2 && GITHUB_TOKEN=... goreleaser release --clean --release-notes /tmp/notes.md
# Published to github.com/dwgebler/gebweb.
version: 2

project_name: gebweb

changelog:
  disable: true

builds:
  - id: gebweb
    main: ./cmd/gebweb
    binary: gebweb
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: gebweb
    ids: [gebweb]
    name_template: "gebweb_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - NOTICES.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: dwgebler
    name: gebweb
  draft: true
  name_template: "Gebweb {{ .Version }}"
